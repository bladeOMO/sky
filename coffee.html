let current = 'home';
let musicInteracted = false;
let wantsMusic = false;
let musicState = audio.error ? 'error' : 'idle';
let musicMessage = '音频加载失败 · 点击重试';
let playbackRequest = 0;

function bufferPercent() {
  if (!Number.isFinite(audio.duration) || audio.duration <= 0) return null;
  let seconds = 0;
  for (let i = 0; i < audio.buffered.length; i++) {
    seconds += audio.buffered.end(i) - audio.buffered.start(i);
  }
  return Math.min(100, Math.floor(seconds / audio.duration * 100));
}

function updateMusicUI() {
  const percent = bufferPercent();
  const progressText = percent === null ? '' : ' · ' + percent + '%';
  const buffering = wantsMusic && musicState !== 'playing';
  const preloading = !musicInteracted && !audio.error &&
    audio.readyState < 3 && audio.networkState === 2;
  const busy = (buffering || preloading) &&
    musicState !== 'error' && musicState !== 'blocked';
  let message;
  if (musicState === 'error' || musicState === 'blocked') {
    message = musicMessage;
  } else if (wantsMusic) {
    message = musicState === 'playing'
      ? '正在播放 · 循环' : '正在缓冲' + progressText;
  } else if (musicInteracted) {
    message = '已暂停 · 点击继续';
  } else if (audio.readyState >= 3) {
    message = current === 'home' ? '已就绪 · 点击进入播放' : '已就绪 · 点击播放';
  } else if (preloading) {
    message = '音乐预加载中' + progressText;
  } else {
    message = current === 'home' ? '点击进入后播放' : '点击播放音乐';
  }
  document.querySelectorAll('.music-status').forEach(el => {
    if (el.textContent !== message) el.textContent = message;
    el.setAttribute('aria-busy', String(busy));
  });
  document.querySelectorAll('.music-play').forEach(button => {
    button.textContent = wantsMusic ? 'Ⅱ' : '▷';
    button.classList.toggle('is-buffering', buffering);
    button.setAttribute('aria-label', wantsMusic ? '暂停音乐' : '播放音乐');
    button.setAttribute('aria-pressed', String(wantsMusic));
  });
  document.querySelectorAll('.music-buffer').forEach(bar => {
    bar.hidden = !busy;
    if (percent === null) bar.removeAttribute('value');
    else bar.value = percent;
  });
}

function handlePlayError(error, request) {
  // A cancelled attempt must not overwrite a later pause or play action.
  if (request !== playbackRequest || !wantsMusic) return;
  wantsMusic = false;
  musicState = error.name === 'NotAllowedError' ? 'blocked' : 'error';
  musicMessage = musicState === 'blocked'
    ? '请点播放按钮开始音乐' : '播放失败 · 点击重试';
  updateMusicUI();
}

function startMusic() {
  musicInteracted = true;
  wantsMusic = true;
  musicState = 'buffering';
  const request = ++playbackRequest;
  try {
    // Retry only after a real failure; navigation never reloads the song.
    if (audio.error) audio.load();
    // Keep play() inside the user's click, before navigation or other work.
    const attempt = audio.play();
    if (attempt) attempt.catch(error => handlePlayError(error, request));
  } catch (error) {
    handlePlayError(error, request);
  }
  updateMusicUI();
}

function toggleMusic() {
  if (wantsMusic || !audio.paused) {
    musicInteracted = true;
    wantsMusic = false;
    playbackRequest++;
    musicState = 'paused';
    audio.pause();
    updateMusicUI();
  } else {
    startMusic();
  }
}

audio.addEventListener('play', () => {
  if (!wantsMusic || audio.paused) return;
  musicState = 'buffering';
  updateMusicUI();
});
audio.addEventListener('playing', () => {
  if (!wantsMusic || audio.paused) return;
  musicState = 'playing';
  updateMusicUI();
});
audio.addEventListener('waiting', () => {
  if (wantsMusic && !audio.paused) musicState = 'buffering';
  updateMusicUI();
});
audio.addEventListener('stalled', () => {
  if (wantsMusic && audio.readyState < 3) musicState = 'buffering';
  updateMusicUI();
});
audio.addEventListener('pause', () => {
  if (!audio.paused) return;
  wantsMusic = false;
  playbackRequest++;
  if (musicState !== 'error' && musicState !== 'blocked') musicState = 'paused';
  updateMusicUI();
});
audio.addEventListener('error', () => {
  if (!audio.error) return;
  wantsMusic = false;
  playbackRequest++;
  musicState = 'error';
  musicMessage = audio.error.code === 3 || audio.error.code === 4
    ? '音频暂时无法播放 · 点击重试' : '音频加载失败 · 点击重试';
  updateMusicUI();
});
['loadstart', 'loadedmetadata', 'loadeddata', 'durationchange',
 'progress', 'canplay', 'canplaythrough', 'suspend'].forEach(event => {
  audio.addEventListener(event, updateMusicUI);
});

function go(id, replace = false) {
  if (!document.getElementById(id)?.classList.contains('page')) id = 'home';
  const entering = id === 'menu' && current === 'home' && !replace;
  // Start on the first entry, while respecting a later manual pause.
  if (entering && !musicInteracted) startMusic();
  document.querySelectorAll('.page').forEach(el => {
    el.classList.toggle('active', el.id === id);
  });
  current = id;
  document.getElementById('footer').style.display = id === 'home' ? 'none' : 'flex';
  document.querySelectorAll('.dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === (id === 'home' ? 0 : 1));
  });
  if (!replace) history.pushState({id}, '', id === 'home' ? location.pathname : '#' + id);
  window.scrollTo({top: 0, behavior: 'auto'});
  updateMusicUI();
}
window.addEventListener('popstate', () => go(location.hash.slice(1) || 'home', true));
window.addEventListener('pageshow', updateMusicUI);
go(location.hash.slice(1) || 'home', true);
</script></body></html>
